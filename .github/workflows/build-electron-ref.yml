name: Build Electron artifact for selected ref

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build-windows-electron:
    name: Package Windows Electron app for ${{ inputs.ref }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Determine version
        shell: bash
        run: |
          VERSION="$(git describe --tags --always)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build frontend
        working-directory: web
        env:
          CI: ""
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN=true \
            VITE_REACT_APP_VERSION="$VERSION" \
            bun run build

      - name: Build Windows server binary
        shell: bash
        run: |
          go mod download
          go build -trimpath \
            -ldflags "-s -w -X new-api/common.Version=${VERSION}" \
            -o new-api.exe .

      - name: Set Electron package version
        shell: bash
        working-directory: electron
        run: |
          PACKAGE_VERSION="${VERSION#v}"
          if [[ "$PACKAGE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]; then
            PACKAGE_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}${BASH_REMATCH[4]}"
          else
            PACKAGE_VERSION="0.0.0-${GITHUB_SHA::12}"
          fi
          npm version "$PACKAGE_VERSION" --no-git-tag-version --allow-same-version

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Build unsigned Windows Electron installers
        working-directory: electron
        run: npm run build:win

      - name: Generate checksums
        shell: bash
        run: sha256sum electron/dist/*.exe > checksums-windows.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-api-windows-electron-${{ github.sha }}
          path: |
            electron/dist/*.exe
            checksums-windows.txt
          if-no-files-found: error
